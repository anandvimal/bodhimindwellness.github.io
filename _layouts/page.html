---
layout: default
---
<header class="page-hero">
  <div class="container">
    {%- if page.eyebrow %}<p class="eyebrow"><span class="l-en">{{ page.eyebrow }}</span><span class="l-fr">{{ page.eyebrow_fr | default: page.eyebrow }}</span></p>{% endif %}
    <h1><span class="l-en">{{ page.title }}</span><span class="l-fr">{{ page.title_fr | default: page.title }}</span></h1>
    {%- if page.intro %}
    <p class="lead"><span class="l-en">{{ page.intro }}</span><span class="l-fr">{{ page.intro_fr | default: page.intro }}</span></p>
    {%- endif %}
  </div>
</header>
{{ content }}
