- name: Arvind M.
  detail: 40 · Mauritius
  group: retreat
  featured: true
  short: "A transformative journey that left me feeling refreshed, inspired, and more in tune with myself. Highly recommended for anyone seeking a holistic escape!"
  text: "I attended one of the 2-day Wellness Break retreats at Heritage Le Telfair Golf & Spa Resort organised by Bodhi Mind Wellness, and it was an incredible experience. Nestled in a serene location, the retreat offered a perfect blend of relaxation and rejuvenation. The daily yoga and chi gong sessions were led by skilled instructors who tailored practices to all levels, fostering a welcoming atmosphere. Meditation workshops provided valuable tools for mindfulness, enhancing the overall experience. The nourishing meals were delicious and catered to various dietary preferences, promoting wellness from the inside out. Additionally, the opportunity to connect with like-minded individuals added a sense of community that was truly uplifting. Overall, this retreat was a transformative journey that left me feeling refreshed, inspired, and more in tune with myself. Highly recommended for anyone seeking a holistic escape!"

