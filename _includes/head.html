<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4d3e">
<script>
  // Pick the language before the page paints, so there is no flash of the wrong one.
  (function () {
    var d = document.documentElement, fixed = d.getAttribute('data-page-lang'), l;
    try { l = localStorage.getItem('lang'); } catch (e) {}
    if (!l) l = (navigator.language || 'en').slice(0, 2).toLowerCase() === 'fr' ? 'fr' : 'en';
    if (fixed) l = fixed;
    d.setAttribute('data-lang', l);
    d.lang = l;
  })();
</script>

<link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url | absolute_url }}">
