# Build settings
permalink: date
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - Gemfile
  - Gemfile.lock
  - script/
  - README.md
  - vendor/
  - "assets/images/Retreats powerpoint.pptx"
